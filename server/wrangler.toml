# Server Sa trường (đấu cờ với bạn bè). Build: node ../tools/build-server.js ; deploy: npx wrangler deploy
name = "cotuong-online"
main = "dist/worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# Durable Object dùng SQLite: có trong gói miễn phí của Cloudflare
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
