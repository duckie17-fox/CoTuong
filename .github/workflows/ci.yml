name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/co-tuong.html phải khớp với src/ (hãy chạy npm run build rồi commit)
        run: git diff --exit-code dist/
