name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: dist/co-tuong.html phải khớp với src/ (hãy chạy npm run build rồi commit)
        run: git diff --exit-code dist/
      - name: Server Sa trường build được cho Cloudflare (không deploy)
        working-directory: server
        run: |
          npm ci
          node ../tools/build-server.js
          npx wrangler deploy --dry-run --outdir /tmp/worker-out
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
